<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Azeem Chicken Center</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Admin Panel - Azeem Chicken Center</h1>
</header>

<main>
  <section id="price-section">
    <h2>Set Chicken Prices</h2>
    <label for="price-skin">With Skin (₹/kg):</label>
    <input type="number" id="price-skin" placeholder="200">

    <label for="price-skinless">Skinless (₹/kg):</label>
    <input type="number" id="price-skinless" placeholder="250">

    <button onclick="savePrices()">Save Prices</button>
  </section>

  <section id="offers-section-admin">
    <h2>Manage Offers</h2>
    <label for="offer-title">Offer Title:</label>
    <input type="text" id="offer-title" placeholder="20% off on 2kg+">

    <label for="offer-img">Offer Image URL:</label>
    <input type="text" id="offer-img" placeholder="images/chicken2.jpg">

    <button onclick="addOffer()">Add Offer</button>
    <div id="offers-list"></div>
  </section>

  <section id="orders-section">
    <h2>Customer Orders (WhatsApp)</h2>
    <ul id="orders-list"></ul>
  </section>
</main>

<script src="admin.js"></script>
</body>
</html>
