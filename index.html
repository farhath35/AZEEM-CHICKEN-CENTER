<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azeem Chicken Center</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffcc80">
</head>
<body>
<header>
  <img src="images/logo.png" alt="Azeem Chicken Center Logo" class="logo">
  <h1>Azeem Chicken Center</h1>
</header>

<main>
  <section id="order-section">
    <img src="images/chicken1.jpg" alt="Chicken Image" class="main-img">
    <h2>Place Your Order</h2>

    <label for="chicken-type">Select Type:</label>
    <select id="chicken-type">
      <option value="skin">With Skin</option>
      <option value="skinless">Skinless</option>
    </select>

    <label for="amount">Amount (₹):</label>
    <input type="number" id="amount" placeholder="100">

    <label for="delivery-place">Delivery Place:</label>
    <input type="text" id="delivery-place" placeholder="Enter address">

    <label for="delivery-time">Delivery Time:</label>
    <input type="time" id="delivery-time">

    <div class="buttons">
      <button onclick="calculateWeight()">Calculate Weight</button>
      <button onclick="sendWhatsAppOrder()">Order via WhatsApp</button>
      <button onclick="payNow()">Pay Now</button>
    </div>

    <p id="result"></p>
  </section>

  <section id="offers-section">
    <h2>Offers</h2>
    <div id="offers"></div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
